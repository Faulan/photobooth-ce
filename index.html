<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UKM Computer Education — Photo Booth MATAF UMC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green-dark:#0b4d2c;--green:#0f7a45;--green-light:#1a9e58;--green-pale:#e8f5e9;--green-bg:#f0f9f0;--lime:#8bc34a;--lime-light:#c5e1a5;--white:#fff;--ink:#1a2e23;--muted:#5a7a68;--shadow:0 8px 32px rgba(11,77,44,.12);--shadow-lg:0 16px 48px rgba(11,77,44,.18);--radius:20px;--radius-sm:14px;--radius-xs:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:var(--green-bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0;transition:all .2s ease}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.97)}
.hidden{display:none!important}

/* === HEADER (RESPONSIVE) === */
.site-header{
  background:linear-gradient(135deg,#0b4d2c 0%,#11703e 40%,#1a9e58 100%);
  padding:0;position:relative;overflow:hidden;z-index:20;
}
.header-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.header-bg .leaf{position:absolute;font-size:40px;opacity:.15;filter:blur(1px)}
.header-bg .leaf:nth-child(1){top:10px;left:5%;font-size:60px;transform:rotate(-30deg)}
.header-bg .leaf:nth-child(2){top:50px;left:20%;font-size:35px;transform:rotate(15deg)}
.header-bg .leaf:nth-child(3){bottom:5px;left:35%;font-size:50px;transform:rotate(-45deg)}
.header-bg .leaf:nth-child(4){top:15px;right:25%;font-size:45px;transform:rotate(25deg)}
.header-bg .leaf:nth-child(5){bottom:10px;right:10%;font-size:55px;transform:rotate(-15deg)}
.header-bg .leaf:nth-child(6){top:5px;right:5%;font-size:30px;transform:rotate(40deg)}
.header-inner{
  max-width:1400px;margin:0 auto;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;
  flex-wrap:wrap;gap:12px;
}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{
  width:50px;height:50px;border-radius:50%;
  background:#ffffff;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.2);border:3px solid rgba(255,255,255,.6);
  flex-shrink:0;
}
.header-logo img{width:75%;height:78%;object-fit:contain}
.header-text h1{color:#fff;font-size:20px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
.header-text p{color:#a5d6a7;font-size:12px;font-weight:600;margin-top:2px}
.header-center{display:flex;align-items:center;gap:12px}
.header-badge{
  background:linear-gradient(135deg,#ffb300,#ff8f00);color:#fff;
  padding:8px 14px;border-radius:12px;font-weight:900;font-size:13px;
  text-align:center;line-height:1.1;box-shadow:0 4px 16px rgba(255,143,0,.3);
}
.header-mascot{
  width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));border:2px solid rgba(255,255,255,.4);background:#fff;
  flex-shrink:0;
}
.header-mascot img{width:100%;height:100%;object-fit:cover}
.header-right{display:flex;align-items:center;gap:12px}
.header-tagline{color:#c8e6c9;font-size:13px;font-weight:700;text-align:right;font-style:italic;line-height:1.3}
.header-tagline span{color:#fff;font-size:15px;display:block}

@media(max-width:768px){
  .header-right{display:none}
  .header-inner{justify-content:center;text-align:center}
  .header-brand{flex-direction:column;align-items:center;text-align:center}
  .header-text h1{font-size:18px}
}

/* === FOOTER === */
.site-footer{
  background:linear-gradient(135deg,#0b4d2c,#11703e);
  padding:16px 20px;text-align:center;position:relative;overflow:hidden;margin-top:auto;
}
.site-footer::before,.site-footer::after{
  content:'🌿';position:absolute;font-size:24px;top:50%;transform:translateY(-50%);opacity:.3;
}
.site-footer::before{left:4%}
.site-footer::after{right:4%;content:'🍃'}
.footer-text{color:#a5d6a7;font-weight:700;font-size:13px;font-style:italic;position:relative;z-index:1}
.footer-text b{color:#fff}

/* === MAIN CONTAINER === */
#app{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:16px 16px 24px}

/* === STEP BAR === */
.step-bar{
  display:flex;align-items:center;gap:6px;background:var(--white);
  border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;
  box-shadow:var(--shadow);border:1px solid #dcedc8;flex-wrap:wrap;
  justify-content:center;
}
.step-item{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:999px;font-weight:700;font-size:12px;color:var(--muted);
  background:#f1f8e9;transition:all .3s;
}
.step-item.active{background:linear-gradient(135deg,#1a9e58,#0f7a45);color:#fff;box-shadow:0 4px 12px rgba(15,122,69,.3)}
.step-item.done{background:#c8e6c9;color:#2e7d32}
.step-num{
  width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08);
  display:grid;place-items:center;font-weight:900;font-size:11px;
}
.step-item.active .step-num{background:rgba(255,255,255,.25)}
.step-sep{color:#c8e6c9;font-size:16px}

@media(max-width:600px){
  .step-sep{display:none}
  .step-bar{gap:4px}
  .step-item{padding:4px 8px;font-size:11px}
}

/* === PANELS === */
.panel{
  background:var(--white);border:1px solid #dcedc8;
  border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;
  width:100%;overflow:hidden;
}
.panel-header{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  padding-bottom:10px;border-bottom:2px solid #e8f5e9;
}
.panel-header .icon{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#e8f5e9,#c8e6c9);font-size:16px;flex-shrink:0;
}
.panel-header h3{font-size:14px;font-weight:800;color:var(--green-dark)}
.panel-header .sub{font-size:11px;color:var(--muted);font-weight:500}

/* === 3 COLUMN LAYOUT === */
.layout-3{
  display:grid;
  grid-template-columns:260px 1fr 260px;
  gap:16px;
  align-items:start;
}
@media(max-width:1100px){
  .layout-3{
    grid-template-columns:1fr;
  }
}

/* === TEMPLATE GRID === */
.tpl-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
  gap:10px;
  max-height:550px;
  overflow-y:auto;
  padding-right:4px;
}
@media(min-width:1101px){
  .tpl-grid{grid-template-columns:1fr}
}
.tpl-grid::-webkit-scrollbar{width:5px}
.tpl-grid::-webkit-scrollbar-thumb{background:#a5d6a7;border-radius:10px}
.tpl-btn{
  background:#f1f8e9;border:2px solid transparent;border-radius:var(--radius-sm);
  padding:6px;transition:all .25s;cursor:pointer;width:100%;
}
.tpl-btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,122,69,.15)}
.tpl-btn.selected{border-color:#1a9e58;background:#e8f5e9;box-shadow:0 0 0 3px #c8e6c9}
.tpl-btn img{width:100%;display:block;border-radius:var(--radius-xs);aspect-ratio:3/4;object-fit:cover}
.tpl-btn small{display:block;text-align:center;font-weight:800;font-size:10px;color:var(--green-dark);padding:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* === CAMERA / PREVIEW === */
.cam-area{display:flex;flex-direction:column;gap:12px}
.cam-wrap{
  position:relative;aspect-ratio:4/3;background:#0a1a12;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-lg);max-width:100%;margin:0 auto;width:100%;
}
.cam-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-status{
  display:flex;justify-content:space-between;align-items:center;
  background:#e8f5e9;border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;
  flex-wrap:wrap;gap:6px;
}
.cam-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;display:inline-block;margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.countdown{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:clamp(80px, 20vw, 120px);font-weight:900;
  text-shadow:0 8px 40px rgba(0,0,0,.6);z-index:3;
  background:rgba(0,0,0,0.1);
}

/* === CONTROL BUTTONS === */
.ctrl-grid{display:grid;gap:10px}
.btn-main{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--radius-sm);font-weight:800;font-size:13px;
  width:100%;text-align:center;
}
.btn-green{
  background:linear-gradient(135deg,#1a9e58,#0f7a45);color:#fff;
  box-shadow:0 6px 20px rgba(15,122,69,.3);
}
.btn-green:hover{box-shadow:0 8px 28px rgba(15,122,69,.4)}
.btn-outline{
  background:var(--white);color:var(--green-dark);
  border:2px solid #c8e6c9;
}
.btn-outline:hover{background:#f1f8e9}
.btn-orange{
  background:linear-gradient(135deg,#ff9800,#f57c00);color:#fff;
  box-shadow:0 6px 20px rgba(255,152,0,.3);
}

/* === QR BOX === */
.qr-box{
  background:#f1f8e9;border:2px solid #c8e6c9;border-radius:var(--radius);
  padding:14px;text-align:center;margin-top:12px;word-break:break-all;
}
.qr-box img{width:160px;height:160px;border-radius:var(--radius-xs);border:3px solid #c8e6c9;max-width:100%}
.qr-box b{display:block;font-size:13px;margin-top:8px;color:var(--green-dark)}
.qr-box .qr-sub{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

/* === RESULT PAGE === */
.result-area{
  background:#f1f8e9;border-radius:var(--radius);padding:12px;
  display:grid;place-items:center;min-height:180px;width:100%;overflow:hidden;
}
.result-area canvas{max-width:100%;height:auto;max-height:450px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)}
.final-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:768px){
  .final-grid{grid-template-columns:1fr}
}
.final-grid .result-area{min-height:auto}
.final-video{background:#0a1a12;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);width:100%}
.final-video video{width:100%;display:block;max-height:450px;object-fit:cover}

/* === START PAGE === */
.start-page{min-height:calc(100vh - 160px);display:grid;place-items:center;padding:10px}
.start-card{
  max-width:750px;width:100%;text-align:center;padding:36px 20px;
  background:linear-gradient(135deg, rgba(240, 249, 240, 0.95), rgba(218, 240, 226, 0.9));
  border:2px solid rgba(26, 158, 88, 0.3);
  border-radius:30px;
  backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(11,77,44,.18), inset 0 1px 0 rgba(255,255,255,0.8);
  position:relative;overflow:hidden;
}
.start-card::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at center,rgba(139,195,74,.15) 0%,transparent 70%);
  pointer-events:none;
}
.start-mascot-container{
  width:160px;height:160px;margin:0 auto 16px;position:relative;z-index:1;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color: transparent;
}
.start-mascot-container::before{
  content:'';position:absolute;inset:-10px;border-radius:50%;
  background:radial-gradient(circle, rgba(26,158,88,0.3) 0%, rgba(139,195,74,0.12) 60%, transparent 85%);
  z-index:-1;filter:blur(14px);
  animation:pulseGlow 1.6s ease-in-out infinite;
}
.start-mascot-container img{
  width:130px;height:130px;object-fit:contain;
  filter:drop-shadow(0 14px 28px rgba(11,77,44,.35));
  animation:pulseScale 1.6s ease-in-out infinite;
  transition:transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
}
.start-mascot-container img:hover{
  transform:scale(1.2) rotate(6deg);
  filter:drop-shadow(0 20px 40px rgba(15,122,69,.6));
}
.start-mascot-container img:active{
  transform:scale(0.85) rotate(-5deg);
  filter:drop-shadow(0 4px 10px rgba(11,77,44,.4));
}
@keyframes pulseScale{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
@keyframes pulseGlow{
  0%,100%{opacity:0.6;transform:scale(0.95)}
  50%{opacity:1;transform:scale(1.18)}
}
.start-card h2{font-size:clamp(26px,5vw,46px);font-weight:900;color:var(--green-dark);letter-spacing:-1px;position:relative;z-index:1}
.start-card p{font-size:15px;color:var(--muted);max-width:500px;margin:12px auto 24px;line-height:1.5;position:relative;z-index:1}
.start-btn{
  font-size:16px;padding:14px 32px;border-radius:var(--radius);
  background:linear-gradient(135deg,#1a9e58,#0f7a45);color:#fff;font-weight:900;
  box-shadow:0 12px 30px rgba(15,122,69,.4);display:inline-flex;align-items:center;gap:10px;
  position:relative;z-index:1;
  animation:buttonBounce 2s ease-in-out infinite;
}
.start-btn:hover{
  box-shadow:0 18px 45px rgba(15,122,69,.6);
  transform:translateY(-3px) scale(1.04);
}
@keyframes buttonBounce{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
.start-features{
  display:flex;gap:12px;justify-content:center;margin-top:24px;position:relative;z-index:1;flex-wrap:wrap;
}
.start-feat{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--green-dark);background:#f1f8e9;padding:6px 12px;border-radius:999px;
}

/* === COUNT SELECTION === */
.count-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
  max-width: 400px;
  margin: 0 auto;
}
.count-btn{
  padding:14px 8px;border-radius:var(--radius-sm);background:#f1f8e9;
  border:2px solid rgba(15, 122, 69, 0.3);font-size:15px;font-weight:900;color:var(--green-dark);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.count-btn:hover{background:#e8f5e9;border-color:rgba(15, 122, 69, 0.6)}
.count-btn.selected{background:#c8e6c9;border-color:#1a9e58;box-shadow:0 0 0 3px rgba(26, 158, 88, 0.2)}
.count-btn .ico{font-size:20px}

/* === PHOTO THUMBS === */
.photo-thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 0;width:100%}
.photo-thumb{
  position:relative;flex-shrink:0;cursor:pointer;border-radius:var(--radius-xs);
  overflow:hidden;border:2px solid #c8e6c9;transition:all .2s;
}
.photo-thumb:hover{border-color:#1a9e58;transform:scale(1.05)}
.photo-thumb img{width:56px;height:56px;object-fit:cover;display:block}
.photo-thumb .retake-label{
  position:absolute;bottom:0;left:0;right:0;background:rgba(15,122,69,.85);
  color:#fff;font-size:9px;text-align:center;padding:2px;font-weight:700;
}
.slot-select-modal {
  background:#f9fff9;border:2px dashed #1a9e58;border-radius:var(--radius-sm);padding:10px;margin-top:10px;
}

/* === DRAG & DROP SWAP === */
.photo-thumb[draggable="true"]{
  cursor:grab;user-select:none;-webkit-user-select:none;
  transition:all .2s ease;
}
.photo-thumb[draggable="true"]:active{cursor:grabbing}
.photo-thumb.dragging{
  opacity:.45;transform:scale(.9);box-shadow:0 0 0 3px rgba(255,152,0,.5);
}
.photo-thumb.drag-over{
  border-color:#ff9800!important;background:rgba(255,152,0,.1);
  box-shadow:0 0 0 3px rgba(255,152,0,.4);transform:scale(1.1);
}
.swap-hint{
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  font-weight:600;font-style:italic;margin-top:4px;
}
.swap-hint .swap-icon{font-size:16px}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-bg">
    <span class="leaf">🌿</span><span class="leaf">🍃</span><span class="leaf">🌱</span>
    <span class="leaf">🍀</span><span class="leaf">🌿</span><span class="leaf">🍃</span>
  </div>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-logo"><img src="logo.png" alt="Logo"></div>
      <div class="header-text">
        <h1>UKM Computer Education</h1>
        <p>Photo Booth • MATAF UMC 2026</p>
      </div>
    </div>
    <div class="header-center">
      <div class="header-badge">MATAF<br>UMC 2026</div>
      <div class="header-mascot"><img src="Maskot CE HD.jpg" alt="Maskot"></div>
    </div>
    <div class="header-right">
      <div class="header-tagline">
        <span>Together Learn Grow ❤</span>
        Bersama Menuju Digital Future
      </div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main id="app"></main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-text">🌿 <b>Bersama Menuju Digital Future</b> — UKM Computer Education 🍃</div>
</footer>

<script>
// DAFTAR SELURUH BINGKAI SESUAI DENGAN FOLDER 'frames'
const ALL_FRAMES = [
  "Frame_01_A.png", "Frame_01_B.png", "Frame_01_C.png", "Frame_01_D.png", "Frame_01_E.png",
  "Frame_02_A.png", "Frame_02_B.png", "Frame_02_C.png",
  "Frame_03_A.png", "Frame_03_B.png",
  "Frame_04_A.png", "Frame_04_B.png",
  "Frame_05_A.png", "Frame_05_B.png",
  "Frame_06_A.png", "Frame_06_B.png", "Frame_06_C.png", "Frame_06_D.png"
].map(f => `frames/${f}`);

const SLOT_MAP={
  1:[['rr', 0.05, 0.12, 0.90, 0.81, 0.055]],
  2:[['rr',.09,.14,.82,.36,.05],['rr',.09,.49,.82,.30,.05]],
  3:[['rr', 0.05, 0.13, 0.93, 0.35, 0.05], ['rr', 0.05, 0.52, 0.45, 0.28, 0.05], ['rr', 0.52, 0.52, 0.45, 0.28, 0.05]],
  4: [
    ['rr', 0.04, 0.17, 0.44, 0.31, 0.05],  
    ['rr', 0.51, 0.17, 0.45, 0.31, 0.05],  
    ['rr', 0.04, 0.48, 0.44, 0.33, 0.05],  
    ['rr', 0.51, 0.48, 0.45, 0.33, 0.05]   
  ],
  5:[
      ['rr', 0.04, 0.18, 0.61, 0.62, 0.05],  
      ['rr', 0.67, 0.18, 0.30, 0.14, 0.03],  
      ['rr', 0.67, 0.33, 0.30, 0.13, 0.03],  
      ['rr', 0.67, 0.48, 0.30, 0.13, 0.03],  
      ['rr', 0.67, 0.63, 0.30, 0.13, 0.03]   
  ],
  6: [
    ['rr', 0.08, 0.16, 0.40, 0.22, 0.05],  
    ['rr', 0.52, 0.16, 0.40, 0.22, 0.05],  
    ['rr', 0.08, 0.39, 0.40, 0.22, 0.05],  
    ['rr', 0.52, 0.39, 0.40, 0.22, 0.05],  
    ['rr', 0.08, 0.62, 0.40, 0.22, 0.05],  
    ['rr', 0.52, 0.62, 0.40, 0.22, 0.05]   
  ]
};

const state = {
  step: 0,
  count: 4,
  frame: 11, // Menyesuaikan indeks default awal
  photos: [],          
  assignedPhotos: [],  
  stream: null,
  timer: 3,
  retakeIndex: -1,
  slotMappingIndex: null,
  mediaRecorder: null,
  recordedChunks: [],
  videoUrl: null,
  uploadedUrl: null
};

const app = document.getElementById('app');

function getFrameCountNumber(framePath) {
  const match = framePath.match(/Frame_0?(\d+)/i);
  return match ? parseInt(match[1], 10) : 1;
}

function playBeep(freq = 440, type = 'sine', duration = 0.15) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function stepBar(activeIdx) {
  const steps = ['Foto', 'Pilih Bingkai', 'Preview', 'Cetak & Scan'];
  return `<div class="step-bar">${steps.map((s, i) => `<div class="step-item ${i === activeIdx ? 'active' : i < activeIdx ? 'done' : ''}"><span class="step-num">${i + 1}</span>${s}</div>${i < steps.length - 1 ? '<span class="step-sep">›</span>' : ''}`).join('')}</div>`;

      r.readAsDataURL(files[0]);
    } else {
      state.photos = [];
      const limitFiles = files.slice(0, state.count);
      limitFiles.forEach(f => {
        const r = new FileReader();
        r.onload = () => {
          state.photos.push(r.result);

        r.readAsDataURL(f);
      });
    }

async function takeSequence() {
  if (!state.stream) return;
  const btn = document.getElementById('shoot');
  btn.disabled = true;
  btn.textContent = 'Mengambil foto...';
  const v = document.getElementById('video');

  if (state.retakeIndex >= 0) {
    document.getElementById('photoNo').textContent = state.retakeIndex + 1;
    await countdown(state.timer);
    state.photos[state.retakeIndex] = captureVideo(v);
    state.retakeIndex = -1;
  } else {
    state.photos = [];
    state.recordedChunks = [];
    try {
      state.mediaRecorder = new MediaRecorder(state.stream, { mimeType: 'video/webm' });
      state.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) state.recordedChunks.push(e.data); };
      state.mediaRecorder.start();
    } catch (e) { console.log('Rekaman tidak didukung', e); }

    for (let i = 0; i < state.count; i++) {
      document.getElementById('photoNo').textContent = i + 1;
      await countdown(state.timer);
      state.photos.push(captureVideo(v));
      await wait(450);
    }
  }

  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    await new Promise(r => {
      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.recordedChunks, { type: 'video/webm' });
        state.videoUrl = URL.createObjectURL(blob);
        r();
      };
      state.mediaRecorder.stop();
    });
    state.mediaRecorder = null;
  }
  if (state.stream) { state.stream.getTracks().forEach(t => t.stop()); state.stream = null; }

  initAssignedPhotos();
  chooseFrame();
}

function countdown(n) {
  return new Promise(resolve => {
    const el = document.getElementById('countdown');
    let x = n;
    el.classList.remove('hidden');
    el.textContent = x;
    playBeep(350, 'sine', 0.1);

    const t = setInterval(() => {
      x--;
      if (x <= 0) {
        clearInterval(t);
        el.classList.add('hidden');
        playBeep(880, 'triangle', 0.25);
        resolve();
      } else {
        el.textContent = x;
        playBeep(350, 'sine', 0.1);
      }
    }, 1000);
  });
}

function captureVideo(v) {
  const c = document.createElement('canvas');
  c.width = v.videoWidth || 1280;
  c.height = v.videoHeight || 720;
  const x = c.getContext('2d');
  x.translate(c.width, 0);
  x.scale(-1, 1);
  x.drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .92);
}

/* === DRAG & DROP SWAP LOGIC === */
let dragSrcSlot = null;

function initDragSwap() {
  const container = document.getElementById('slotThumbs');
  if (!container) return;
  const thumbs = container.querySelectorAll('.photo-thumb[draggable="true"]');

  thumbs.forEach(thumb => {
    // --- Drag events (desktop) ---
    thumb.addEventListener('dragstart', handleDragStart);
    thumb.addEventListener('dragend', handleDragEnd);
    thumb.addEventListener('dragover', handleDragOver);
    thumb.addEventListener('dragenter', handleDragEnter);
    thumb.addEventListener('dragleave', handleDragLeave);
    thumb.addEventListener('drop', handleDrop);

    // --- Touch events (mobile) ---
    thumb.addEventListener('touchstart', handleTouchStart, { passive: false });
    thumb.addEventListener('touchmove', handleTouchMove, { passive: false });
    thumb.addEventListener('touchend', handleTouchEnd);
  });
}

function handleDragStart(e) {
  dragSrcSlot = parseInt(this.dataset.slot);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcSlot);
}

function handleDragEnd(e) {
  this.classList.remove('dragging');
  document.querySelectorAll('.photo-thumb').forEach(el => el.classList.remove('drag-over'));
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function handleDragEnter(e) {
  e.preventDefault();
  const target = this.closest('.photo-thumb');
  if (target && parseInt(target.dataset.slot) !== dragSrcSlot) {
    target.classList.add('drag-over');
  }
}

function handleDragLeave(e) {
  this.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetSlot = parseInt(this.dataset.slot);
  if (dragSrcSlot !== null && dragSrcSlot !== targetSlot) {
    swapSlots(dragSrcSlot, targetSlot);
  }
  this.classList.remove('drag-over');
  dragSrcSlot = null;
}

// --- Touch support for mobile drag-swap ---
let touchSrcSlot = null;
let touchClone = null;
let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;

function handleTouchStart(e) {
  const slot = parseInt(this.dataset.slot);
  touchSrcSlot = slot;
  touchMoved = false;
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;

  // Create floating clone
  touchClone = this.cloneNode(true);
  touchClone.style.position = 'fixed';
  touchClone.style.zIndex = '9999';
  touchClone.style.pointerEvents = 'none';
  touchClone.style.opacity = '0.8';
  touchClone.style.transform = 'scale(1.15)';
  touchClone.style.transition = 'none';
  touchClone.style.width = this.offsetWidth + 'px';
  touchClone.style.height = this.offsetHeight + 'px';
  touchClone.style.left = (touch.clientX - this.offsetWidth / 2) + 'px';
  touchClone.style.top = (touch.clientY - this.offsetHeight / 2) + 'px';
  touchClone.style.boxShadow = '0 8px 24px rgba(255,152,0,.4)';
  touchClone.style.borderRadius = 'var(--radius-xs)';
}

function handleTouchMove(e) {
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartX);
  const dy = Math.abs(touch.clientY - touchStartY);

  if (dx > 8 || dy > 8) {
    touchMoved = true;
    e.preventDefault();

    if (touchClone && !touchClone.parentNode) {
      document.body.appendChild(touchClone);
      this.classList.add('dragging');
    }

    if (touchClone) {
      touchClone.style.left = (touch.clientX - this.offsetWidth / 2) + 'px';
      touchClone.style.top = (touch.clientY - this.offsetHeight / 2) + 'px';
    }

    // Highlight drop target
    document.querySelectorAll('.photo-thumb').forEach(el => el.classList.remove('drag-over'));
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (target) {
      const thumbTarget = target.closest('.photo-thumb[draggable="true"]');
      if (thumbTarget && parseInt(thumbTarget.dataset.slot) !== touchSrcSlot) {
        thumbTarget.classList.add('drag-over');
      }
    }
  }
}

function handleTouchEnd(e) {
  this.classList.remove('dragging');

  if (touchClone && touchClone.parentNode) {
    touchClone.parentNode.removeChild(touchClone);
  }
  touchClone = null;

  if (!touchMoved) {
    // Short tap — let the onclick handle it
    touchSrcSlot = null;
    return;
  }

  const touch = e.changedTouches[0];
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  if (target) {
    const thumbTarget = target.closest('.photo-thumb[draggable="true"]');
    if (thumbTarget) {
      const targetSlot = parseInt(thumbTarget.dataset.slot);
      if (touchSrcSlot !== null && touchSrcSlot !== targetSlot) {
        e.preventDefault();
        swapSlots(touchSrcSlot, targetSlot);
      }
    }
  }

  document.querySelectorAll('.photo-thumb').forEach(el => el.classList.remove('drag-over'));
  touchSrcSlot = null;
  touchMoved = false;
}

function swapSlots(fromIdx, toIdx) {
  // Tukar foto di assignedPhotos
  const temp = state.assignedPhotos[fromIdx];
  state.assignedPhotos[fromIdx] = state.assignedPhotos[toIdx];
  state.assignedPhotos[toIdx] = temp;

  // Re-render preview tanpa reset assigned (skipInit = true)
  playBeep(600, 'triangle', 0.12);
  chooseFrame(true);
}

        ['rr', 0.67, 0.18, 0.30, 0.14, 0.03], // Kotak Kecil 1 Kanan A (Default)
        ['rr', 0.67, 0.33, 0.30, 0.13, 0.03], // Kotak Kecil 2 Kanan A (Default)
        ['rr', 0.67, 0.48, 0.30, 0.13, 0.03], // Kotak Kecil 3 Kanan A (Default)
        ['rr', 0.67, 0.63, 0.30, 0.13, 0.03]  // Kotak Kecil 4 Kanan A (Default)
      ];
    }
  } else if (fNum === 6) {
    // 👉 PENGATURAN KHUSUS UNTUK FRAME 6 (A, B, C, D)
    if (currentFramePath.includes('Frame_06_C')) {
      slots = [
        ['rr', 0.05, 0.15, 0.46, 0.26, 0.02], // Slot Kiri Atas C
        ['rr', 0.49, 0.15, 0.46, 0.26, 0.02], // Slot Kanan Atas C
        ['rr', 0.05, 0.36, 0.46, 0.26, 0.02], // Slot Kiri Tengah C
        ['rr', 0.49, 0.36, 0.46, 0.26, 0.02], // Slot Kanan Tengah C
        ['rr', 0.05, 0.57, 0.46, 0.26, 0.02], // Slot Kiri Bawah C
        ['rr', 0.49, 0.57, 0.46, 0.26, 0.02]  // Slot Kanan Bawah C
      ];
    } else if (currentFramePath.includes('Frame_06_D')) {
      slots = [
        ['rr', 0.05, 0.15, 0.46, 0.25, 0.02], // Slot Kiri Atas D (diperbesar & radius 0.02)
        ['rr', 0.49, 0.15, 0.46, 0.25, 0.02], // Slot Kanan Atas D (diperbesar & radius 0.02)
        ['rr', 0.05, 0.36, 0.46, 0.25, 0.02], // Slot Kiri Tengah D (diperbesar & radius 0.02)
        ['rr', 0.49, 0.36, 0.46, 0.25, 0.02], // Slot Kanan Tengah D (diperbesar & radius 0.02)
        ['rr', 0.05, 0.57, 0.46, 0.25, 0.02], // Slot Kiri Bawah D (diperbesar & radius 0.02)
        ['rr', 0.49, 0.57, 0.46, 0.25, 0.02]  // Slot Kanan Bawah D (diperbesar & radius 0.02)
      ];
    } else {
      // Default untuk Frame 06 A & B yang sudah kita atur pas sebelumnya
      slots = [
        ['rr', 0.08, 0.16, 0.40, 0.22, 0.05], // Slot Kiri Atas A/B
        ['rr', 0.52, 0.16, 0.40, 0.22, 0.05], // Slot Kanan Atas A/B
        ['rr', 0.08, 0.39, 0.40, 0.22, 0.05], // Slot Kiri Tengah A/B
        ['rr', 0.52, 0.39, 0.40, 0.22, 0.05], // Slot Kanan Tengah A/B
        ['rr', 0.08, 0.62, 0.40, 0.22, 0.05], // Slot Kiri Bawah A/B
        ['rr', 0.52, 0.62, 0.40, 0.22, 0.05]  // Slot Kanan Bawah A/B
      ];
    }
  } else {
    slots = SLOT_MAP[fNum] || SLOT_MAP[1];
  }
  // ---------------------------------

  const imgs = await Promise.all(slots.map(async (_, i) => {
    const src = state.assignedPhotos[i];
    if (src) {
      return new Promise(r => {
        const im = new Image();
        im.onload = () => r(im);
        im.src = src;
      });
    }
    return null;
  }));

  imgs.forEach((im, i) => {
    if (i >= slots.length || !im) return;
    const s = slots[i];
    const x = s[1] * canvas.width, y = s[2] * canvas.height, w = s[3] * canvas.width, h = s[4] * canvas.height;
    ctx.save();
    if (s[0] === 'el') {
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    } else {
      const rad = (s[5] || .04) * canvas.width;
      roundRect(ctx, x, y, w, h, rad);
    }
    ctx.clip();
    cover(ctx, im, x, y, w, h);
    ctx.restore();
  });
  ctx.drawImage(frame, 0, 0);
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function cover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height, tr = w / h;
  let sw, sh, sx, sy;
  if (ir > tr) { sh = img.height; sw = sh * tr; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / tr; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

async function uploadToCloudinary(fileData, resourceType = 'image') {
  const cloudName = 'djjefvop';
  const uploadPreset = 'ml_default';
  const formData = new FormData();
  formData.append('file', fileData);
  formData.append('upload_preset', uploadPreset);

  const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/${resourceType}/upload`, {
    method: 'POST',
    body: formData
  });
  const text = await res.text();
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error('Respons server bukan JSON.'); }
  if (res.ok && json.secure_url) return json.secure_url;
  throw new Error((json && json.error && json.error.message) || 'Upload gagal.');
}

async function sharePhoto() {
  try {
    const data = getData();
    const arr = data.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
      u8arr[n] = bstr.charCodeAt(n);
    }
    const photoFile = new File([u8arr], 'UKM-Photo.jpg', { type: mime });
    const filesArray = [photoFile];

    if (state.videoUrl && state.recordedChunks && state.recordedChunks.length > 0) {
      const vBlob = new Blob(state.recordedChunks, { type: 'video/webm' });
      filesArray.push(new File([vBlob], 'UKM-LiveVideo.webm', { type: 'video/webm' }));
    }

    // 1) Coba Web Share API dengan file (HP yang support)
    if (navigator.share && navigator.canShare && navigator.canShare({ files: filesArray })) {
      await navigator.share({ 
        title: 'Foto & Video Booth UKM', 
        text: 'Berikut hasil foto dan live video dari MATAF UMC 2026!', 
        files: filesArray 
      });
      return;
    }

    // 2) Fallback: Upload ke Cloudinary lalu kirim link via WhatsApp
    const shareStatus = document.createElement('div');
    shareStatus.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9999';
    shareStatus.innerHTML = `
      <div style="background:#fff;border-radius:20px;padding:32px 28px;text-align:center;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
        <div style="font-size:36px;animation:pulse 1s infinite">⏳</div>
        <b style="display:block;margin-top:12px;color:#0b4d2c;font-size:15px">Menyiapkan file untuk dibagikan...</b>
        <div id="shareProgress" style="font-size:12px;color:#5a7a68;margin-top:8px">Mengunggah foto...</div>
        <button class="btn-main btn-outline" style="margin-top:16px;padding:8px 16px;font-size:12px" onclick="this.closest('div[style]').remove()">Batal</button>
      </div>`;
    document.body.appendChild(shareStatus);

    let photoUrl = '';
    let videoUrl = '';

    try {
      // Upload foto saja ke Cloudinary (video terlalu besar untuk upload gratis)
      const progressEl = document.getElementById('shareProgress');
      photoUrl = await uploadToCloudinary(data, 'image');

      // Hapus loading overlay
      if (shareStatus.parentNode) shareStatus.remove();

      // Buat pesan WhatsApp dengan link foto
      let waMsg = '📸 *Foto Booth UKM Computer Education — MATAF UMC 2026* 📸\n\n';
      waMsg += '🖼️ Lihat foto kamu di sini:\n' + photoUrl + '\n';
      if (state.videoUrl) {
        waMsg += '\n🎬 _Video rekaman tersedia, silakan minta langsung dari booth ya!_\n';
      }
      waMsg += '\n🌿 _Bersama Menuju Digital Future_ — UKM Computer Education 🍃';

      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(waMsg), '_blank');

    } catch (uploadErr) {
      if (shareStatus.parentNode) shareStatus.remove();
      throw uploadErr;
    }

  } catch (e) {
    if (e.name !== 'AbortError') alert("❌ Bagikan gagal:\n" + e.message);
  }
}

    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
      method: 'POST',
      body: formData
    });

    // Ambil teks terlebih dahulu untuk menghindari error jika respons bukan JSON valid
